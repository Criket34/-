<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Clip OBJ ダウンロード</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; }
    p { text-align: center; }
    #downloadLink { text-align: center; margin-top: 20px; }
    a { font-size: 20px; color: #007bff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/exporters/OBJExporter.js"></script>
</head>
<body>

  <h1>3D Clip OBJ ダウンロード</h1>
  <p>以下のリンクをクリックすると、クリップの3D OBJファイルをダウンロードできます。</p>

  <div id="downloadLink" style="text-align: center; margin-top: 20px;">
    <button onclick="downloadOBJ()">OBJファイルをダウンロード</button>
  </div>

  <script>
    // 3Dクリップモデルを作成する関数
    function createClipModel() {
      const scene = new THREE.Scene();

      // ベース部分を作成
      const baseGeometry = new THREE.BoxGeometry(50, 30, 3);
      const baseMaterial = new THREE.MeshBasicMaterial({ color: 0x777777 });
      const base = new THREE.Mesh(baseGeometry, baseMaterial);
      scene.add(base);

      // 丸いフック部分を作成
      const hookGeometry = new THREE.CylinderGeometry(7, 7, 20, 16);
      const hookMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });

      // フック1とフック2を作成して配置
      const hook1 = new THREE.Mesh(hookGeometry, hookMaterial);
      hook1.position.set(12.5, 15, 3);
      scene.add(hook1);

      const hook2 = new THREE.Mesh(hookGeometry, hookMaterial);
      hook2.position.set(37.5, 15, 3);
      scene.add(hook2);

      // フックの連結部分を作成
      const connectorGeometry = new THREE.CylinderGeometry(3, 3, 50, 16);
      const connectorMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });
      const connector = new THREE.Mesh(connectorGeometry, connectorMaterial);
      connector.position.set(25, 15, 3);
      scene.add(connector);

      return scene;
    }

    // OBJファイルをダウンロードする関数
    function downloadOBJ() {
      const scene = createClipModel(); // 3Dモデルの作成

      const exporter = new THREE.OBJExporter(); // OBJエクスポーターのインスタンスを作成
      const objData = exporter.parse(scene); // 3DシーンからOBJデータをエクスポート

      // ダウンロード用のリンクを作成
      const blob = new Blob([objData], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob); // BlobデータをURLに変換
      const a = document.createElement('a'); // <a>タグを作成
      a.href = url; // URLをリンクに設定
      a.download = 'paper_clip.obj'; // ダウンロードするファイル名を設定
      a.click(); // リンクをクリックしてダウンロードを実行
    }
  </script>

</body>
</html>
